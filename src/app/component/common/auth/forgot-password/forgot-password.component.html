<div class="forgot-container flex h-[100vh] bg-white">
    <div class="welcome-section flex-col md:w-2/4 px-[64px] py-5">
       <div class="flex items-center justify-center h-[90vh]">
            <img src="assets/images/auth/forgot-password.png"
                alt="Forgot Password">
        </div>
    </div>
    <div class="form-container md:w-2/4 w-full flex items-center justify-center">
       <div class="forgot-box md:shadow-md">
           <div class="mb-8 flex items-center">
               <div
                   class="w-8 h-8 bg-secondary rounded-full flex items-center justify-center text-white">
                   <i class="ri-lock-line"></i>
               </div>
               <h1 class="text-2xl font-bold text-gray-800 ml-3">
                   Reset Your Password
               </h1>
           </div>
           <p class="text-gray-600 mb-6">
            Enter your registered email address and we'll send you instructions
            to reset your password.
            </p>
   
           <form [formGroup]="forgotForm">
               <div class="mb-4">
                   <label class="block text-gray-700 mb-1">Email</label>
                   <app-simple-input
                    formControlName="email"
                    [isInvalid]="forgotForm.controls['email'].invalid && forgotForm.controls['email'].touched"
                    [errorList]="[
                        {
                            error: forgotForm.controls['email'].errors?.['required'],
                            errorMessage: 'Email is required' 
                        },
                        {
                            error: forgotForm.controls['email'].errors?.['email'],
                            errorMessage: 'Please enter a valid email address' 
                        }
                    ]"
                    placeholder="Enter your email address"></app-simple-input>
               </div>

               <button
                   type="button"
                   (click)="onSubmit()"
                   class="submit-btn w-full py-2 px-4 mt-4 text-white font-medium rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-opacity-50 !rounded-button whitespace-nowrap">
                   Send Reset Link
               </button>
   
           </form>
   
           <div class="mt-6 text-center text-gray-600">
            Don't have an account?
            <a (click)="goToLogin()" class="text-secondary hover:underline cursor-pointer">Back to Login</a>
          </div>
       </div>
    </div>
</div>
